[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hamer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "setuptools>=68",
    "einops>=0.8.1",
    "gdown>=5.2.1",
    "hydra-colorlog>=1.2.0",
    "hydra-core>=1.3.2",
    "hydra-submitit-launcher>=1.2.0",
    "mmcv==1.3.9",
    "numpy>=1.23,<2",
    "opencv-python",
    "pandas>=2.3.3",
    "pip>=25.3",
    "pyrender>=0.1.45",
    "pyrootutils>=1.0.4",
    "rich>=14.3.0",
    "scikit-image>=0.24.0",
    "smplx==0.1.28",
    "timm>=1.0.24",
    "torch==2.9.0",
    "torchaudio==2.9.0",
    "torchvision==0.24.0",
    "webdataset>=0.2.100",
    "xtcocotools>=1.14.3",
    "yacs>=0.1.8",
    "pytorch-lightning>=2.6.0",
    "h5py>=3.14.0",
    #"mmpose>=0.24.0",
    #"chumpy",
    #"detectron2",
    
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hamer*"]


[tool.uv.sources]
torch = { index = "pytorch" }
torchaudio = { index = "pytorch" }
torchvision = { index = "pytorch" }
#detectron2 = { git = "https://github.com/facebookresearch/detectron2" }
chumpy = { git = "https://github.com/mattloper/chumpy" }
mmpose = { path = "third-party/ViTPose", editable = true }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
