[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imitator-maskgen"
version = "0.1.0"
description = "Imitator Game LeRobot mask generation utilities using local Grounded-SAM-2."
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.24.4",
  "pandas>=2.0",
  "pyarrow>=12",
  "pillow>=9.4.0",
  "tqdm>=4.66.1",
  "av>=13.0.0",
  "datasets>=2.19.0,<4",
  "opencv-python>=4.7.0",
  "supervision>=0.22.0",
  "transformers==4.41.2",
  "timm>=0.9",
  "addict>=2.4.0",
  "yapf>=0.40",
  "pycocotools>=2.0.8",
  "hydra-core>=1.3.2",
  "hf_transfer>=0.1.8",
  "iopath>=0.1.10",
  "setuptools>=68",
  "wheel",
  "packaging",
  "torch==2.5.1",
  "torchvision==0.20.1",
  "torchcodec==0.1.1",
]

[project.optional-dependencies]
viz = [
  "imageio[ffmpeg]>=2.31",
  "matplotlib>=3.7",
]

[tool.setuptools]
py-modules = []

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchcodec = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.maskgen]
# Local source tree expected by mask_gen_whole.py defaults.
# Install it separately in editable mode because SAM2 and GroundingDINO build
# local CUDA/C++ extensions and may need CUDA_HOME/TORCH_CUDA_ARCH_LIST.
grounded_sam2_root = "../../../../../Grounded-SAM-2"
install_commands = [
  "uv sync --extra viz",
  "uv pip install -e ../../../../../Grounded-SAM-2",
  "uv pip install --no-build-isolation -e ../../../../../Grounded-SAM-2/grounding_dino",
]
