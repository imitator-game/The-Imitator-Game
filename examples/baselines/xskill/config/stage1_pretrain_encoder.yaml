base_dev_dir: runs/

hydra:
  run:
    dir: '${base_dev_dir}/xskill/experiment/pretrain/'

resume_from_checkpoint: null

# Follow vqbet data defaults
seed: 42
batch_size: 128
num_workers: 16
pin_memory: True
persistent_workers: True
drop_last: True

# Follow vqbet observation defaults
resize_shape: [144, 144]
max_get_threads: 4
human_root: null
sim_root: null
robot_root: null
task_mapping_file: 'examples/baselines/lerobot_dataset/task_mapping.json'
human_dataset_file: 'examples/baselines/lerobot_dataset/config/exp_configs/human_train_config_45.json'
sim_dataset_file: 'examples/baselines/lerobot_dataset/config/exp_configs/sim_train_config_45.json'
robot_dataset_file: 'examples/baselines/lerobot_dataset/config/exp_configs/robot_train_config_45.json'
human_task_description_file: 'examples/baselines/lerobot_dataset/task_desc/human_desc.json'
sim_task_description_file: 'examples/baselines/lerobot_dataset/task_desc/sim_desc.json'
robot_task_description_file: 'examples/baselines/lerobot_dataset/task_desc/robot_desc.json'
target_domain: 'sim'
split: 'train'
cameras: ['zed2i']
include_depth: False
image_size: [144, 144]
num_frames: 30
video_backend: 'torchcodec'
fps: 30
state_type: 'qpos'
single_arm: False
enable_augmentation: False
sampling_strategy: 'uniform_jitter'
pre_decode: False
pre_decode_cache_dir: "tmp/integrated_video_cache"
pre_decode_num_workers:  4

robot_dataset:
  _target_: xskill.dataset.xskill_imitator_dataset.XskillVideoDataset
  human_root: ${human_root}
  sim_root: ${sim_root}
  task_mapping_file: ${task_mapping_file}
  human_dataset_file: ${human_dataset_file}
  sim_dataset_file: ${sim_dataset_file}
  human_task_description_file: ${human_task_description_file}
  sim_task_description_file: ${sim_task_description_file}
  split: ${split}
  cameras: ${cameras}
  include_depth: ${include_depth}
  image_size: ${image_size}
  num_frames: ${num_frames}
  video_backend: ${video_backend}
  fps: ${fps}
  state_type: ${state_type}
  single_arm: ${single_arm}
  enable_augmentation: ${enable_augmentation}
  sampling_strategy: ${sampling_strategy}
  task_names: null
  max_videos_per_task: null
  seed: ${seed}
  resize_shape: ${resize_shape}
  max_get_threads: ${max_get_threads}
  video_type: 'robot'
  slide: 3

human_dataset:
  _target_: xskill.dataset.xskill_imitator_dataset.XskillVideoDataset
  human_root: ${human_root}
  sim_root: ${sim_root}
  task_mapping_file: ${task_mapping_file}
  human_dataset_file: ${human_dataset_file}
  sim_dataset_file: ${sim_dataset_file}
  human_task_description_file: ${human_task_description_file}
  sim_task_description_file: ${sim_task_description_file}
  split: ${split}
  cameras: ${cameras}
  include_depth: ${include_depth}
  image_size: ${image_size}
  num_frames: ${num_frames}
  video_backend: ${video_backend}
  fps: ${fps}
  state_type: ${state_type}
  single_arm: ${single_arm}
  enable_augmentation: ${enable_augmentation}
  sampling_strategy: ${sampling_strategy}
  task_names: null
  max_videos_per_task: null
  seed: ${seed}
  resize_shape: ${resize_shape}
  max_get_threads: ${max_get_threads}
  video_type: 'human'
  slide: 3

augmentations: ['random_crop_112_112','color_jitter','grayscale','gaussian_blur','normalize']

Trainer:
  accelerator: "gpu"
  devices: [0]
  max_epochs: 10
  enable_progress_bar: False
  log_every_n_steps: 10

n_layer: 8

Model:
  _target_: xskill.model.core.Model
  dim: 128
  T: 0.1
  clutser_T: ${Model.T}
  epsilon: 0.03
  stack_frames: 1
  sinkhorn_iterations: 3
  slide: ${robot_dataset.slide}
  freeze_prototypes_epoch: 0
  n_negative_samples: 4
  reverse_augment: False
  time_augment: True
  swav_loss_coef: 0.5
  cluster_loss_coef: 1
  lr: 2e-4
  skill_prior_encoder: null
  use_lr_scheduler: True
  use_temperature_scheduler: False
  positive_window: 1
  negative_window: 2

  skill_prior:
    _target_: xskill.model.encoder.VisualMotionPrior
    out_size: 128
    vision_only: True
    vision_encoder:
      _target_: xskill.model.encoder.CNN
      out_size: ${Model.skill_prior.out_size}
    nmb_prototypes: ${Model.dim}
    normalize: False

  encoder_q:
    _target_: xskill.model.encoder.VisualMotionEncoder
    vision_only: True
    state_size: 256
    out_size: 256
    vision_encoder:
      _target_: xskill.model.encoder.CNN
      out_size: ${Model.encoder_q.state_size}
    nmb_prototypes: ${Model.dim}
    normalize: True
    start_end: True
    goal_condition: False

    temporal_transformer_encoder:
      _target_: xskill.model.transformer.TorchTransformerEncoder
      query_dim: ${Model.encoder_q.state_size}
      heads: 4
      dim_feedforward: 512
      n_layer: ${n_layer}
      rep_dim: ${Model.encoder_q.out_size}
      use_encoder: False
      input_dim: null
      pos_encoder:
        _target_: xskill.model.transformer.PositionalEncoding
        size: ${Model.encoder_q.state_size}
        max_len: 10
        frequency: 10

callback:
  every_n_epoch: 1
